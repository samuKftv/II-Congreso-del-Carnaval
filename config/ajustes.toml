# Ajustes del Estudio de imágenes.
# Después de cambiar algo, cierra la ventana negra del estudio y vuelve a abrirlo.

[evento]
nombre = "CarnaLab 2026"
subtitulo = "Estudio de imágenes"
# Nombre completo del congreso y una línea con fecha y lugar: salen en la entrada y en el proyector.
congreso = "II Congreso Internacional de Profesionalización del Carnaval"
lema = "15 OCT · Santa Cruz de Tenerife · TEA · #LABCIFPLasIndias"
# Centro que organiza el estudio (pie de la entrada y texto del logo).
centro = "CIFP Las Indias"
# Logo (PNG, JPG, WEBP o SVG). Vacío = sin logo.
logo = "config/logo-las-indias.png"
# Cartel del congreso: sale en la entrada y en el proyector mientras no hay imágenes. Vacío = sin cartel.
cartel = "config/cartel.jpg"

[colores]
# Colores del cartel de CarnaLab 2026, en formato "#rrggbb".
# Pon un # al principio de una línea para volver al color original de la app.
fondo = "#003060"        # azul marino del cartel
principal = "#e33943"    # rojo coral
secundario = "#f6dcc1"   # crema
acento = "#9ecac7"       # aguamarina
extra = "#f2836f"        # coral claro (degradados)
extra2 = "#3d86b3"       # azul medio (decoración)
extra3 = "#165f94"       # azul intenso (decoración)
texto_suave = "#b9d3d6"  # textos secundarios

[servidor]
# Si lo cambias, cambia también el número en el archivo del firewall
# (1-PERMITIR-FIREWALL.bat o abrir_firewall.bat).
puerto = 8080
# Dirección que aparece en el QR. Vacío = se detecta sola.
# Si el QR muestra una IP que no es la de la WiFi del aula, escríbela aquí (p. ej. "192.168.1.50").
direccion = ""
# Abre el panel del profesor en el navegador al arrancar.
abrir_navegador = true

[acceso]
# Código que se pide al entrar. Vacío ("") = se entra solo con escanear el QR (recomendado).
# Si pones uno, el QR ya lo lleva dentro y quien escanee no lo teclea.
codigo = ""
# Clave del panel cuando lo abres desde OTRO dispositivo. Desde este PC no se pide.
clave_profesor = "cambia-esta-clave"

[internet]
# Modo internet: el estudio recibe una dirección pública https (un túnel gratuito de Cloudflare) y el
# público entra con sus datos móviles o con cualquier WiFi, aunque la red del recinto aísle los
# dispositivos. Solo hace falta que este PC tenga internet. Lo más fácil es no tocar esto y arrancar
# con 2-INICIAR-ESTUDIO-POR-INTERNET.bat, que además descarga cloudflared la primera vez.
activado = false

[alumnado]
# true = pantalla del móvil sencilla: escribir la idea, "Inspírame" y Crear, con dos pestañas grandes
# (Crear y Votar). No se elige técnica, carnaval ni formato: se usan los de aquí abajo.
sencillo = true
# Técnica y formato de todas las imágenes en modo sencillo (ids de estilos.json y de [formatos]).
estilo = "libre"
formato = "cuadrado"
# true = se puede crear a partir de una foto propia ("conviérteme en…").
fotos = false

[proyector]
# Máximo de piezas del mosaico. Se usa la rejilla con forma de cartel más grande que quepa
# (con 150 salen 11 × 13 = 143 piezas). Cuando se llena, cada imagen nueva sustituye a la más antigua.
piezas_mosaico = 150

[comfyui]
# "auto" busca ComfyUI en el puerto 8188 (portable o manual) y en el 8000 (ComfyUI Desktop).
# Si lo tienes en otro sitio, escribe la dirección, p. ej. "http://127.0.0.1:8188".
url = "auto"
# Workflow exportado desde ComfyUI con "Exportar (API)".
workflow = "config/workflow_api.json"
# true = carga el modelo en fp8, que ocupa la mitad de memoria. Z-Image Turbo normal (bf16) ocupa 12 GB
# y no cabe entero en una gráfica de 12 GB, así que ComfyUI va pasando trozos y tarda más. En fp8 cabe
# entero y va bastante más rápido, con una diferencia de calidad casi imperceptible.
# Compruébalo con el simulacro: prueba true y false y mira los "s por imagen".
ligero = true
# Segundos máximos por imagen antes de darla por fallida.
tiempo_maximo = 180
# Solo si la app no encuentra sola el nodo del prompt o del tamaño: pon aquí su número de nodo.
nodo_prompt = ""
nodo_tamano = ""

[mi_modelo]
# Tu propio modelo y tu LoRA. Déjalo todo vacío ("") para usar el modelo del workflow tal cual.
# Copia los archivos en las carpetas de ComfyUI y escribe aquí solo el nombre del archivo
# (si están en una subcarpeta o te olvidas de ".safetensors", la app los encuentra igual).
# De qué modelo sale el tuyo. Cada familia necesita su propio workflow:
#   "z-image-turbo"        el de config/workflow_api.json (Z-Image Turbo)
#   "flux2-klein-4b"       FLUX.2 Klein 4B destilado: 4 pasos (necesita flux2-vae.safetensors en models/vae)
#   "flux2-klein-4b-base"  FLUX.2 Klein 4B base (sin destilar): 20 pasos, más lento
#   "auto"                 lo deduce del nombre del archivo ("klein" -> FLUX.2 Klein 4B)
# Si te equivocas, ComfyUI da el error "mat1 and mat2 shapes cannot be multiplied" y el panel te avisa.
base = "auto"
# Tu modelo, en ComfyUI/models/diffusion_models.
modelo = ""
# Tu LoRA, en ComfyUI/models/loras.
lora = ""
# Cuánto se nota el LoRA: 1.0 = tal cual lo entrenaste. Si "se come" las ideas de la gente, baja a 0.6-0.8.
# Para elegirla: 5-PROBAR-MI-MODELO.bat hace una hoja con la misma idea sin LoRA y con varias fuerzas.
fuerza_lora = 1.0
# La palabra de activación con la que entrenaste el LoRA (si usaste una). Se pone delante de cada idea.
palabra_clave = ""
# Pasos y guía (CFG). 0 = los de la familia elegida arriba. Cámbialos solo si tu modelo lo pide.
pasos = 0
cfg = 0

[interprete]
# Una IA de texto (Ollama) convierte cada idea del alumnado, aunque sea corta, rara o en español,
# en una descripción detallada en inglés antes de pintarla. Funciona sin internet, en el procesador
# (no le quita memoria a la gráfica) y trabaja por adelantado mientras la gente espera turno.
# Se instala con 4-INSTALAR-INTERPRETE.bat. Si Ollama no está abierto, las ideas se pintan tal cual.
activado = true
url = "http://127.0.0.1:11434"
modelo = "qwen2.5:3b"

[limites]
# Imágenes en cola a la vez por persona (1 = turnos justos para todos).
en_cola_por_persona = 1
max_caracteres = 400

[fotos]
# Cuánto cambia la foto del alumno cada opción (0 = nada, 1 = imagen totalmente nueva).
fuerzas = { poco = 0.5, bastante = 0.68, mucho = 0.82 }

[formatos]
# nombre = [ancho, alto]. Z-Image Turbo trabaja bien alrededor de 1 megapíxel.
cuadrado = [1024, 1024]
vertical = [832, 1216]
horizontal = [1216, 832]

[moderacion]
# true = cada imagen espera a que la apruebes en el panel antes de salir en el proyector,
# el mosaico y la galería de la clase. Quien la crea la ve siempre en su móvil.
# También se cambia desde el panel.
revisar_antes = true

# Palabras que bloquean el prompt (sin importar mayúsculas ni tildes).
# Termina en * para bloquear todo lo que empiece así: "desnud*" bloquea desnudo, desnuda...
palabras_prohibidas = [
  "desnud*", "nude", "nudes", "naked", "nsfw", "porn*", "xxx", "hentai",
  "sexo", "sex", "sexual*", "erotic*", "genital*", "pene", "penes", "vagina*",
  "tetas", "pezon*", "nipple*", "topless", "gore", "decapitad*",
]
