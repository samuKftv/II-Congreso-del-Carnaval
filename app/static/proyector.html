<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyector del estudio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
  <link rel="stylesheet" href="/static/estilo.css">
  <link rel="stylesheet" href="/tema.css">
  <style>
    body { overflow: hidden; }
    .escena {
      position: relative; z-index: 1; height: calc(100vh - 8px); height: calc(100dvh - 8px);
      display: grid; grid-template-columns: minmax(280px, 26vw) 1fr; gap: 2.2vw; padding: 1.4vw 2.2vw;
    }
    .lateral { display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }
    /* El logo, con sus colores oficiales, sobre una placa blanca */
    .logo-proyector { max-height: 9vh; max-width: 100%; object-fit: contain; align-self: flex-start; background: #fff; padding: 0.9vh 1.1vw; border-radius: 14px; box-shadow: var(--sombra); }
    .lateral .titulo-evento { font-size: clamp(1.8rem, 2.8vw, 3.2rem); }
    .lateral .subtitulo { font-size: clamp(0.8rem, 1vw, 1.1rem); }
    .lateral .congreso { margin: 0.6vh 0 0; font-weight: 800; font-size: clamp(0.85rem, 1.1vw, 1.3rem); line-height: 1.25; }
    .lateral .lema { margin: 0.4vh 0 0; color: var(--magenta); font-weight: 900; font-size: clamp(0.8rem, 1vw, 1.15rem); }
    .vacia .cartel-vacio { max-height: 64vh; max-width: 90%; margin: 0 auto; border-radius: 18px; box-shadow: var(--sombra); animation: balanceo 7s ease-in-out infinite; }
    @keyframes balanceo { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    .acceso { text-align: center; padding: 1.6vh 1.2vw; }
    .acceso h2 { margin: 0 0 1.2vh; font-size: clamp(1.2rem, 1.8vw, 2rem); font-weight: 900; }
    .acceso img { width: 100%; max-width: 21vw; max-height: 34vh; object-fit: contain; margin: 0 auto; border-radius: 16px; background: #fff; }
    .acceso .pista { margin: 1.2vh 0 0; color: var(--suave); font-weight: 800; font-size: clamp(0.9rem, 1.1vw, 1.3rem); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 14px; border-radius: 999px; background: var(--capa-2); border: 1px solid var(--borde); font-weight: 800; font-size: clamp(0.85rem, 1vw, 1.15rem); }
    .chip.cerrado { background: rgba(255, 84, 112, 0.2); border-color: rgba(255, 84, 112, 0.5); }

    .principal { display: grid; grid-template-rows: auto 1fr auto; gap: 1.4vw; min-height: 0; }

    /* Reto en marcha */
    .banda-reto {
      display: flex; align-items: center; gap: 1.4vw; padding: 1vw 1.8vw; border-radius: 24px;
      background: linear-gradient(100deg, color-mix(in srgb, var(--magenta) 35%, transparent), color-mix(in srgb, var(--amarillo) 22%, transparent));
      border: 2px solid color-mix(in srgb, var(--amarillo) 60%, transparent); font-weight: 900; font-size: clamp(1.2rem, 2vw, 2.4rem); line-height: 1.15;
    }
    .banda-reto .bandera { font-size: 1.6em; }
    .banda-reto small { display: block; font-size: 0.55em; color: var(--suave); font-weight: 800; }
    .banda-reto .reloj { margin-left: auto; font-variant-numeric: tabular-nums; font-size: clamp(2.2rem, 4.4vw, 5.2rem); color: var(--amarillo); line-height: 1; white-space: nowrap; }
    .banda-reto .reloj.ultimo { color: var(--magenta); animation: latir 1s ease-in-out infinite; }

    /* Imagen destacada y tira */
    .destacada { position: relative; border-radius: 28px; overflow: hidden; background: var(--noche-2); box-shadow: var(--sombra); min-height: 0; grid-row: 2; }
    .destacada .difuso { position: absolute; inset: -30px; width: calc(100% + 60px); height: calc(100% + 60px); object-fit: cover; filter: blur(40px) brightness(0.55) saturate(1.3); }
    .destacada .nitida { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .destacada.entra .nitida { animation: entrar 0.9s cubic-bezier(.2, .9, .3, 1.15); }
    @keyframes entrar { from { transform: scale(0.7) rotate(-3deg); opacity: 0; } }
    .pie { position: absolute; left: 0; right: 0; bottom: 0; padding: 4vw 2vw 1.4vw; background: linear-gradient(transparent, rgba(10, 4, 22, 0.92)); }
    .pie .autor { font-weight: 900; font-size: clamp(1.2rem, 2vw, 2.4rem); }
    .pie .texto { margin-top: 4px; color: var(--suave); font-weight: 700; font-size: clamp(0.95rem, 1.3vw, 1.5rem); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .nueva {
      position: absolute; top: 1.4vw; left: 1.4vw; padding: 10px 18px; border-radius: 999px;
      background: var(--amarillo); color: var(--tinta); font-weight: 900; font-size: clamp(0.9rem, 1.3vw, 1.4rem);
      animation: latir 1s ease-in-out infinite;
    }
    @keyframes latir { 50% { transform: scale(1.08); } }
    .tira { display: grid; grid-template-columns: repeat(8, 1fr); gap: 1vw; grid-row: 3; }
    .tira figure { margin: 0; position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: var(--capa-2); }
    .tira img { width: 100%; height: 100%; object-fit: cover; }
    .tira figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 5px; font-size: clamp(0.65rem, 0.8vw, 0.95rem); font-weight: 800; text-align: center; background: linear-gradient(transparent, rgba(10, 4, 22, 0.9)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vacia { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; }
    .vacia .grande { font-size: clamp(4rem, 9vw, 9rem); animation: bailar 2.4s ease-in-out infinite; display: inline-block; }
    .vacia p { margin: 0; font-size: clamp(1.4rem, 2.6vw, 3rem); font-weight: 900; }
    @keyframes bailar { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) translateY(-10px); } }

    /* Votación, podio y ranking */
    .especial { grid-row: 2 / 4; display: flex; flex-direction: column; gap: 1.2vw; min-height: 0; }
    .especial h2 { margin: 0; font-size: clamp(1.8rem, 3.2vw, 3.8rem); font-weight: 900; line-height: 1.1; }
    .especial .sub { margin: 0; color: var(--suave); font-weight: 800; font-size: clamp(1rem, 1.5vw, 1.8rem); }
    .votacion { flex: 1; display: grid; grid-template-columns: repeat(var(--columnas, 4), 1fr); align-content: start; gap: 1vw; min-height: 0; }
    .votacion figure { position: relative; margin: 0; aspect-ratio: 1; border-radius: 20px; overflow: hidden; background: var(--capa-2); }
    .votacion figure.lider { outline: 5px solid var(--amarillo); outline-offset: -5px; }
    .votacion img { width: 100%; height: 100%; object-fit: cover; }
    .votacion figcaption { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: end; gap: 8px; padding: 30px 12px 10px; font-weight: 900; font-size: clamp(0.9rem, 1.3vw, 1.6rem); background: linear-gradient(transparent, rgba(10, 4, 22, 0.92)); }
    .votacion figcaption span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .votos-chip { flex: none; padding: 4px 12px; border-radius: 999px; background: var(--magenta); }
    .votacion figure.sube .votos-chip { animation: subir 0.7s ease; }
    @keyframes subir { 40% { transform: scale(1.5); } }
    .podio { flex: 1; display: grid; grid-template-columns: 1fr 1.2fr 1fr; align-items: end; gap: 2vw; min-height: 0; padding-bottom: 1vh; }
    .puesto { display: flex; flex-direction: column; align-items: center; gap: 0.8vh; min-width: 0; animation: aparecer-puesto 0.8s cubic-bezier(.2, .9, .3, 1.2) both; }
    .puesto.p2 { animation-delay: 0.4s; } .puesto.p3 { animation-delay: 0.8s; } .puesto.p1 { animation-delay: 1.2s; }
    @keyframes aparecer-puesto { from { transform: translateY(40px) scale(0.9); opacity: 0; } }
    .puesto .marco { width: min(100%, 32vh); aspect-ratio: 1; border-radius: 24px; overflow: hidden; box-shadow: var(--sombra); background: var(--capa-2); }
    .puesto.p1 .marco { width: min(100%, 40vh); outline: 6px solid var(--amarillo); }
    .puesto img { width: 100%; height: 100%; object-fit: cover; }
    .puesto .medalla { font-size: clamp(2.2rem, 3.6vw, 4.6rem); line-height: 1; }
    .puesto .nombre { font-weight: 900; font-size: clamp(1.1rem, 1.9vw, 2.3rem); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .puesto .votos-chip { font-weight: 900; font-size: clamp(0.9rem, 1.3vw, 1.6rem); }
    .puesto .peana { width: 100%; border-radius: 18px 18px 0 0; background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04)); display: grid; place-items: center; font-weight: 900; font-size: clamp(1.8rem, 3.2vw, 4rem); color: var(--suave); }
    .puesto.p1 .peana { height: 9vh; color: var(--amarillo); } .puesto.p2 .peana { height: 6vh; } .puesto.p3 .peana { height: 4vh; }
    .podio-vacio { flex: 1; display: grid; place-content: center; text-align: center; font-size: clamp(1.4rem, 2.4vw, 2.8rem); font-weight: 900; color: var(--suave); }

    /* Mosaico gigante con forma de cartel */
    .vista-mosaico { grid-row: 2 / 4; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; }
    .banda-reto[hidden] ~ .vista-mosaico { grid-row: 1 / 4; }  /* sin reto, el cartel usa todo el alto */
    /* Con el mosaico, el lateral y el cartel van juntos y centrados en la pantalla */
    body.modo-mosaico .escena { grid-template-columns: minmax(260px, 24vw) auto; justify-content: center; column-gap: 4vw; }
    body.modo-mosaico .lateral { justify-content: center; }
    body.modo-mosaico .chip:not(.cerrado) { display: none; }
    .lienzo { position: relative; flex: none; border-radius: 18px; overflow: hidden; background: #050b18; box-shadow: var(--sombra); }
    .rejilla-mosaico { position: absolute; inset: 0; z-index: 0; transition: filter 0.6s; }
    .lienzo.con-foco .rejilla-mosaico { filter: brightness(0.35) blur(2px); }
    .celda {
      position: absolute; overflow: hidden; border-radius: 2px;
      background-color: var(--noche-2); background-image: var(--cartel, none); background-repeat: no-repeat;
      background-size: var(--ancho) var(--alto);
    }
    .celda.libre { filter: brightness(0.42) saturate(0.7); }
    .celda img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.4s; }
    .celda img.espera { opacity: 0; }
    .celda.llega { animation: brillo 1.6s ease-out; z-index: 2; }
    @keyframes brillo { 0% { box-shadow: 0 0 0 3px var(--amarillo), 0 0 30px 10px var(--amarillo); } 100% { box-shadow: 0 0 0 0 transparent; } }
    .celda.m1, .celda.m2, .celda.m3 { z-index: 1; overflow: visible; outline: max(2px, calc(var(--celda) * 0.06)) solid var(--amarillo); }
    .celda.m2 { outline-color: #d9dee8; } .celda.m3 { outline-color: #e2a36b; }
    .celda.m1::after, .celda.m2::after, .celda.m3::after { position: absolute; top: -0.35em; right: -0.3em; font-size: max(16px, calc(var(--celda) * 0.55)); line-height: 1; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.6)); }
    .celda.m1::after { content: "🥇"; } .celda.m2::after { content: "🥈"; } .celda.m3::after { content: "🥉"; }
    .velo { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: fill; opacity: 0; transition: opacity 2.5s ease-in-out; pointer-events: none; }
    .lienzo.cartel .velo { opacity: 0.62; }
    .rotulo {
      position: absolute; z-index: 2; left: 50%; bottom: 4%; transform: translateX(-50%); width: max-content; max-width: 92%;
      padding: 0.7vw 1.4vw; border-radius: 999px; background: rgba(5, 11, 24, 0.82); text-align: center;
      font-weight: 900; font-size: clamp(0.9rem, 1.35vw, 1.6rem); opacity: 0; transition: opacity 1.2s; pointer-events: none;
    }
    .lienzo.cartel .rotulo-cartel, .rotulo.visible { opacity: 1; }
    .rotulo-vacio { top: 50%; bottom: auto; transform: translate(-50%, -50%); font-size: clamp(1.1rem, 1.8vw, 2.2rem); line-height: 1.3; border-radius: 24px; white-space: normal; }
    .rotulo-nivel { top: 6%; bottom: auto; background: var(--amarillo); color: var(--tinta); }


    .foco { position: fixed; z-index: 30; pointer-events: none; }
    .foco-marco { position: fixed; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 4px var(--amarillo), 0 30px 80px -10px rgba(0, 0, 0, 0.9); animation: entrar 0.9s cubic-bezier(.2, .9, .3, 1.15); background: var(--noche-2); }
    .foco-marco img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .foco-pie { position: fixed; text-align: center; transition: opacity 0.3s; display: grid; gap: 0.4vw; justify-items: center; }
    .foco-pie .nueva { position: static; }
    .foco-pie b { font-size: clamp(1.3rem, 2.2vw, 2.6rem); font-weight: 900; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); }
    .foco-pie span:last-child { max-width: 100%; color: var(--texto); font-weight: 700; font-size: clamp(0.95rem, 1.3vw, 1.5rem); text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .foco.vuela .foco-pie { opacity: 0; }

    @media (max-aspect-ratio: 1/1) {
      .vista-mosaico { height: 80vh; }
      body { overflow: auto; }
      .escena { grid-template-columns: 1fr; height: auto; }
      .destacada { aspect-ratio: 1; }
      .acceso img { max-width: 50vw; }
      .tira { grid-template-columns: repeat(4, 1fr); }
      .votacion { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 40vw; }
    }
  </style>
</head>
<body>
  <div class="cinta"></div>
  <div class="escena">
    <aside class="lateral">
      <img class="logo-proyector" id="logo" alt="" hidden>
      <div>
        <h1 class="titulo-evento" id="evento"></h1>
        <p class="subtitulo" id="subtitulo"></p>
        <p class="congreso" id="congreso" hidden></p>
        <p class="lema" id="lema" hidden></p>
      </div>
      <div class="tarjeta acceso">
        <h2>📱 ¡Crea y vota!</h2>
        <img id="qr" src="/qr.svg" alt="Código QR para entrar al estudio">
        <p class="pista">Escanéalo con la cámara del móvil</p>
      </div>
      <div class="chips">
        <span class="chip" id="chip-estado">🟢 Abierto</span>
        <span class="chip" id="chip-cola">⏳ 0 en cola</span>
        <span class="chip" id="chip-total">🎨 0 imágenes creadas</span>
      </div>
    </aside>

    <main class="principal">
      <div class="banda-reto" id="banda-reto" hidden></div>
      <div class="destacada" id="destacada">
        <div class="vacia" id="vacia">
          <div><span class="grande">🎭</span></div>
          <p>¡Las primeras imágenes aparecerán aquí!</p>
        </div>
      </div>
      <div class="tira" id="tira"></div>
      <section class="especial" id="especial" hidden></section>
      <section class="vista-mosaico" id="vista-mosaico" hidden>
        <div class="lienzo" id="lienzo">
          <div class="rejilla-mosaico" id="rejilla-mosaico"></div>
          <img class="velo" id="velo" alt="" hidden>
          <div class="rotulo rotulo-cartel">🧩 ¡Entre todos estamos formando el cartel de CarnaLab!</div>
          <div class="rotulo rotulo-vacio" id="rotulo-vacio">📱 Escanea el QR<br>y crea la primera pieza del mosaico</div>
          <div class="rotulo rotulo-nivel" id="rotulo-nivel"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/comun.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const NUEVA_DURANTE = 20000;   // ms que una imagen recién hecha se queda fija
    const CAMBIO_CADA = 8000;      // ms entre imágenes del pase automático
    const RANKING_CADA = 75000;    // ms entre apariciones del ranking
    const RANKING_DURA = 12000;    // ms que se muestra el ranking

    let imagenes = [];
    let destacadaId = null;
    let ultimaNueva = 0;
    let indicePase = 0;
    let vistas = null;
    let modo = 'normal';           // normal | votacion | podio | ranking | ganadoras | mosaico
    let finRanking = 0;
    let proximoRanking = Date.now() + RANKING_CADA;
    let firmaEspecial = '';
    let celebrado = null;
    let finReto = null;
    let votosPrevios = new Map();
    const nodoVacio = $('vacia');

    async function iniciar() {
      try {
        const info = await api('/api/info');
        $('evento').textContent = info.evento;
        $('subtitulo').textContent = info.subtitulo;
        document.title = `Proyector · ${info.evento}`;
        if (info.logo) {
          $('logo').src = info.logo;
          $('logo').alt = info.centro || info.evento;
          $('logo').hidden = false;
        }
        for (const campo of ['congreso', 'lema']) {
          $(campo).textContent = info[campo];
          $(campo).hidden = !info[campo];
        }
        prepararCartel(info.cartel);
        if (info.cartel) {
          nodoVacio.replaceChildren(
            el('img', { class: 'cartel-vacio', src: info.cartel, alt: `Cartel de ${info.evento}` }),
            el('p', {}, '¡Escanea el QR y crea la primera imagen!'));
        }
        pintarAcceso(info.url);
      } catch {
        setTimeout(iniciar, 3000);
        return;
      }
      refrescar();
      setInterval(refrescar, 3000);
      setInterval(pase, CAMBIO_CADA);
      setInterval(pintarReloj, 1000);
      setInterval(fasesCartel, CARTEL_CADA);
      new ResizeObserver(() => maquetar()).observe($('vista-mosaico'));
    }

    let urlQr = '';
    function pintarAcceso(direccion) {
      if (direccion === urlQr) return;
      urlQr = direccion;
      $('qr').src = `/qr.svg?v=${encodeURIComponent(direccion)}`;  // solo el QR: sin enlaces ni códigos
    }

    async function refrescar() {
      let g;
      try { g = await api('/api/galeria?limite=40&ranking=true'); } catch { return; }
      pintarAcceso(g.url);
      $('chip-estado').textContent = g.abierto ? '🟢 Estudio abierto' : '🌙 Estudio cerrado';
      $('chip-estado').classList.toggle('cerrado', !g.abierto);
      $('chip-cola').textContent = `⏳ ${g.en_cola} en cola`;
      $('chip-total').textContent = `🎨 ${g.total} ${g.total === 1 ? 'imagen creada' : 'imágenes creadas'}`;
      imagenes = g.imagenes;

      const r = g.reto;
      pintarBandaReto(r);
      const nueva = detectarNueva();

      if (r && r.fase === 'votando') return mostrarVotacion(r);
      if (r && r.fase === 'podio') return mostrarPodio(r.podio, `🏆 Podio del reto «${r.titulo}»`, `reto-${r.id}`, 'podio');
      const vista = g.concurso ? g.concurso.vista : 'galeria';
      if (vista === 'podio') return mostrarPodio(g.ranking || [], '🏆 ¡Ganadoras del concurso!', 'concurso', 'ganadoras');
      if (vista === 'mosaico') return mostrarMosaico(g);
      if (modo === 'ranking' && Date.now() < finRanking && !nueva) return;
      if (modo !== 'normal') volverNormal();

      const ids = new Set(imagenes.map((i) => i.id));
      if (nueva) {
        ultimaNueva = Date.now();
        indicePase = 0;
        destacar(nueva, true);
      } else if (destacadaId && !ids.has(destacadaId)) {
        imagenes.length ? destacar(imagenes[0], false) : vaciar();  // la ocultó el profesor
      } else if (!destacadaId && imagenes.length) {
        destacar(imagenes[0], false);
      }
      pintarTira();

      const tranquilo = Date.now() - ultimaNueva > NUEVA_DURANTE;
      if (!r && tranquilo && Date.now() > proximoRanking && g.ranking && g.ranking.length) {
        proximoRanking = Date.now() + RANKING_CADA;
        finRanking = Date.now() + RANKING_DURA;
        mostrarPodio(g.ranking, '🏆 Las más votadas', null, 'ranking');
      }
    }

    function detectarNueva() {
      const ids = new Set(imagenes.map((i) => i.id));
      if (vistas === null) {
        vistas = ids;   // al abrir el proyector no celebramos las antiguas
        return null;
      }
      const nueva = imagenes.find((i) => !vistas.has(i.id));
      imagenes.forEach((i) => vistas.add(i.id));
      return nueva || null;
    }

    // --- Reto ---

    function pintarBandaReto(r) {
      const banda = $('banda-reto');
      if (!r || r.fase !== 'creando') {
        banda.hidden = true;
        finReto = null;
        return;
      }
      finReto = r.quedan != null ? Date.now() + r.quedan * 1000 : null;
      banda.replaceChildren(
        el('span', { class: 'bandera' }, '🏁'),
        el('div', {}, `RETO: «${r.titulo}»`,
          el('small', {}, `${r.imagenes} ${r.imagenes === 1 ? 'imagen participa' : 'imágenes participan'} · ¡crea la tuya desde el móvil!`)),
        el('span', { class: 'reloj', id: 'reloj' }, finReto ? textoReloj() : '¡A crear!'));
      banda.hidden = false;
    }

    function textoReloj() {
      const s = Math.max(0, Math.round((finReto - Date.now()) / 1000));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function pintarReloj() {
      if (!finReto || !$('reloj')) return;
      $('reloj').textContent = textoReloj();
      $('reloj').classList.toggle('ultimo', finReto - Date.now() < 30000);
    }

    // --- Modos especiales ---

    // Enseña una sola de las zonas: 'normal' (destacada y tira), 'especial' (votación y podios) o 'mosaico'
    function pantalla(nombre) {
      document.body.classList.toggle('modo-mosaico', nombre === 'mosaico');
      if (nombre !== 'mosaico') document.querySelector('.principal').style.width = '';
      $('destacada').hidden = $('tira').hidden = nombre !== 'normal';
      $('especial').hidden = nombre !== 'especial';
      $('vista-mosaico').hidden = nombre !== 'mosaico';
      if (nombre !== 'mosaico') cancelarFocos();
    }

    function mostrarEspecial(nuevoModo) {
      if (modo !== nuevoModo) firmaEspecial = '';
      modo = nuevoModo;
      pantalla('especial');
    }

    function volverNormal() {
      modo = 'normal';
      firmaEspecial = '';
      celebrado = null;
      pantalla('normal');
    }

    async function mostrarVotacion(r) {
      let g;
      try { g = await api('/api/galeria?ambito=reto&orden=votos&limite=12'); } catch { return; }
      mostrarEspecial('votacion');
      const lista = g.imagenes;
      const firma = JSON.stringify(['votacion', r.titulo, lista.map((t) => [t.id, t.votos])]);
      if (firma === firmaEspecial) return;
      firmaEspecial = firma;
      const subieron = new Set(lista.filter((t) => votosPrevios.has(t.id) && t.votos > votosPrevios.get(t.id)).map((t) => t.id));
      votosPrevios = new Map(lista.map((t) => [t.id, t.votos]));
      $('especial').replaceChildren(
        el('h2', {}, `🗳️ ¡A votar! «${r.titulo}»`),
        el('p', { class: 'sub' }, 'En el móvil: pulsa ❤️ Votar y dale ❤️ a tus favoritas'),
        lista.length
          ? el('div', { class: 'votacion', style: { '--columnas': lista.length <= 3 ? 3 : lista.length <= 8 ? 4 : 6 } }, lista.map((t, i) =>
              el('figure', { class: `${i === 0 && t.votos ? 'lider' : ''} ${subieron.has(t.id) ? 'sube' : ''}` },
                el('img', { src: t.mini, alt: t.prompt }),
                el('figcaption', {}, el('span', {}, t.alias), el('span', { class: 'votos-chip' }, `❤️ ${t.votos}`)))))
          : el('div', { class: 'podio-vacio' }, 'Nadie ha participado en este reto… ¡todavía!'));
    }

    function mostrarPodio(lista, titulo, clave, nuevoModo) {
      mostrarEspecial(nuevoModo);
      const firma = JSON.stringify([titulo, lista.map((t) => [t.id, t.votos])]);
      if (firma === firmaEspecial) return;
      firmaEspecial = firma;
      const orden = [[lista[1], 'p2', '🥈', '2'], [lista[0], 'p1', '🥇', '1'], [lista[2], 'p3', '🥉', '3']];
      $('especial').replaceChildren(
        el('h2', {}, titulo),
        lista.length
          ? el('div', { class: 'podio' }, orden.map(([t, clase, medalla, numero]) => t
              ? el('div', { class: `puesto ${clase}` },
                  el('div', { class: 'medalla' }, medalla),
                  el('div', { class: 'marco' }, el('img', { src: t.vista || t.imagen, alt: t.prompt })),
                  el('div', { class: 'nombre' }, t.alias),
                  el('span', { class: 'votos-chip' }, `❤️ ${t.votos} ${t.votos === 1 ? 'voto' : 'votos'}`),
                  el('div', { class: 'peana' }, numero))
              : el('div', {})))
          : el('div', { class: 'podio-vacio' }, 'Aún no hay votos.'));
      if (clave === null || clave !== celebrado) {
        celebrado = clave;
        setTimeout(() => confeti(clave ? 160 : 70), 1200);
      }
    }

    // --- Mosaico ---
    // Cada imagen aprobada es una pieza. Las piezas van rellenando, en orden aleatorio, una rejilla con la forma
    // del cartel; los huecos enseñan el cartel en oscuro. Cada cierto tiempo el cartel aparece encima de todas.
    // La rejilla tiene un máximo de piezas (piezas_mosaico en ajustes.toml): la pieza número n va siempre al hueco
    // n módulo huecos, así que, cuando se llena, cada imagen nueva sustituye a la más antigua.
    const CARTEL_CADA = 30000;   // ms entre apariciones del cartel
    const CARTEL_DURA = 8000;    // ms que se queda el cartel
    const MAX_FOCOS = 3;         // si llegan muchas de golpe, solo las últimas salen en grande

    const mosaico = {
      proporcion: null,          // alto / ancho del cartel
      piezas: [],                // en orden de aprobación
      conocidas: null,           // ids ya vistos (null = aún no se ha cargado)
      porAterrizar: new Set(),   // piezas que están en grande y todavía no tienen su hueco a la vista
      colaFoco: [],
      enFoco: false,
      pausaHasta: 0,             // sin piezas en grande mientras se anuncia que el mosaico está completo
      maximo: 150,               // piezas como mucho (lo dice el servidor)
      total: null,               // imágenes aprobadas en total
      temporizadores: [],
      columnas: 0,
      filas: 0,
      orden: [],                 // celda de cada pieza
      podio: [],
      vista: false,
    };

    function prepararCartel(url) {
      if (!url) return;
      const img = new Image();
      img.onload = () => {
        mosaico.proporcion = img.naturalHeight / img.naturalWidth;
        $('rejilla-mosaico').style.setProperty('--cartel', `url("${url}")`);
        $('velo').src = url;
        $('velo').hidden = false;
        if (mosaico.columnas) {
          construir(true);
          asignar();
        }
      };
      img.src = url;
    }

    function proporcion() {
      if (mosaico.proporcion) return mosaico.proporcion;
      return 4 / 3;  // sin cartel: rejilla vertical
    }

    // La rejilla con más piezas que quepa en el máximo, con piezas casi cuadradas (con 150: 10 × 15)
    function medidas() {
      const p = proporcion();
      let mejor = [3, 3], puntos = -1;
      for (let columnas = 3; columnas <= 60; columnas++) {
        for (let filas = 3; columnas * filas <= mosaico.maximo; filas++) {
          const forma = (p * columnas) / filas;  // alto / ancho de cada pieza
          if (forma < 0.85 || forma > 1.18) continue;
          const valor = columnas * filas - Math.abs(1 - forma);
          if (valor > puntos) { puntos = valor; mejor = [columnas, filas]; }
        }
      }
      return mejor;
    }

    // Orden aleatorio pero siempre el mismo para cada tamaño: cada pieza conserva su hueco
    function barajar(n, semilla) {
      const orden = [...Array(n).keys()];
      let s = semilla >>> 0;
      const azar = () => {
        s = (s + 0x6D2B79F5) >>> 0;
        let x = Math.imul(s ^ (s >>> 15), 1 | s);
        x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
      for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(azar() * (i + 1));
        [orden[i], orden[j]] = [orden[j], orden[i]];
      }
      return orden;
    }

    function construir(forzar = false) {
      const [columnas, filas] = medidas();
      if (!forzar && columnas === mosaico.columnas && filas === mosaico.filas) return;
      mosaico.columnas = columnas;
      mosaico.filas = filas;
      mosaico.orden = barajar(columnas * filas, columnas * 1000 + filas);
      $('rejilla-mosaico').replaceChildren(...Array.from({ length: columnas * filas }, () => el('div', { class: 'celda libre' })));
      maquetar();
    }

    function maquetar() {
      const zona = $('vista-mosaico');
      if (zona.hidden || !mosaico.columnas) return;
      const caja = zona.getBoundingClientRect();
      // Ancho libre junto al lateral (la columna del cartel se ajusta a su tamaño)
      const escena = document.querySelector('.escena');
      const e = getComputedStyle(escena);
      const unaColumna = e.gridTemplateColumns.trim().split(/\s+/).length === 1;
      const libre = escena.clientWidth - parseFloat(e.paddingLeft) - parseFloat(e.paddingRight)
        - (unaColumna ? 0 : document.querySelector('.lateral').getBoundingClientRect().width + parseFloat(e.columnGap));
      if (!caja.height || libre <= 0) return;
      const p = proporcion();
      let alto = caja.height;  // todo el alto disponible
      let ancho = alto / p;
      if (ancho > libre) { ancho = libre; alto = ancho * p; }
      document.querySelector('.principal').style.width = unaColumna ? '' : `${Math.floor(ancho)}px`;
      const lienzo = $('lienzo');
      lienzo.style.width = `${ancho}px`;
      lienzo.style.height = `${alto}px`;

      const { columnas, filas } = mosaico;
      const hueco = columnas >= 30 ? 1 : 2;
      const w = (ancho - (columnas - 1) * hueco) / columnas;
      const h = (alto - (filas - 1) * hueco) / filas;
      const rejilla = $('rejilla-mosaico');
      rejilla.style.setProperty('--ancho', `${ancho}px`);
      rejilla.style.setProperty('--alto', `${alto}px`);
      rejilla.style.setProperty('--celda', `${Math.min(w, h)}px`);
      [...rejilla.children].forEach((celda, i) => {
        const x = (i % columnas) * (w + hueco);
        const y = Math.floor(i / columnas) * (h + hueco);
        Object.assign(celda.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`, backgroundPosition: `${-x}px ${-y}px` });
      });
    }

    function hueco(pieza) {
      return mosaico.orden[pieza.n % mosaico.orden.length];
    }

    function celdaDe(pieza) {
      return $('rejilla-mosaico').children[hueco(pieza)];
    }

    // Pone cada pieza en su celda (solo cambia lo que hace falta)
    function asignar() {
      const celdas = $('rejilla-mosaico').children;
      const deCelda = new Map(mosaico.piezas.map((pieza) => [hueco(pieza), pieza]));
      for (let c = 0; c < celdas.length; c++) {
        const celda = celdas[c];
        const pieza = deCelda.get(c);
        celda.classList.remove('m1', 'm2', 'm3');
        if (!pieza) {
          if (celda.dataset.id) { celda.replaceChildren(); delete celda.dataset.id; }
          celda.classList.add('libre');
          continue;
        }
        if (celda.dataset.id !== pieza.id) {
          celda.dataset.id = pieza.id;
          celda.replaceChildren(el('img', { src: pieza.tesela, alt: '', decoding: 'async' }));
        }
        const espera = mosaico.porAterrizar.has(pieza.id);
        celda.firstChild.classList.toggle('espera', espera);
        celda.classList.toggle('libre', espera);
        const puesto = mosaico.podio.indexOf(pieza.id);
        if (puesto >= 0 && !espera) celda.classList.add(`m${puesto + 1}`);
      }
    }

    async function mostrarMosaico(g) {
      if (modo !== 'mosaico') {
        modo = 'mosaico';
        firmaEspecial = '';
        celebrado = null;
        pantalla('mosaico');
        requestAnimationFrame(maquetar);
      }
      let m;
      try { m = await api('/api/mosaico'); } catch { return; }
      if (modo !== 'mosaico') return;
      const primeraVez = mosaico.conocidas === null;
      if (primeraVez || m.maximo !== mosaico.maximo) {
        mosaico.maximo = m.maximo;
        construir(true);
      }
      const huecos = mosaico.columnas * mosaico.filas;
      // Solo las últimas que caben; cada una con su número de orden, que decide su hueco
      const piezas = m.piezas.slice(-huecos);
      const desde = m.primera + m.piezas.length - piezas.length;
      piezas.forEach((p, i) => { p.n = desde + i; });
      const nuevas = primeraVez ? [] : piezas.filter((p) => !mosaico.conocidas.has(p.id));
      const seLlena = !primeraVez && mosaico.total < huecos && m.total >= huecos;
      mosaico.conocidas = new Set(piezas.map((p) => p.id));
      mosaico.piezas = piezas;
      mosaico.total = m.total;
      mosaico.podio = (g.ranking || []).map((t) => t.id);

      if (seLlena) anunciarCompleto();
      const conFoco = nuevas.slice(-MAX_FOCOS);
      conFoco.forEach((p) => mosaico.porAterrizar.add(p.id));
      mosaico.colaFoco.push(...conFoco);
      asignar();
      nuevas.filter((p) => !conFoco.includes(p)).forEach((p) => destellar(p.id));
      $('rotulo-vacio').classList.toggle('visible', m.total === 0);
      siguienteFoco();
    }

    function anunciarCompleto() {
      const rotulo = $('rotulo-nivel');
      rotulo.textContent = '🎉 ¡Mosaico completo! Ahora cada imagen nueva sustituye a la más antigua';
      rotulo.classList.add('visible');
      confeti(160);
      mosaico.pausaHasta = Date.now() + 6000;
      programar(() => rotulo.classList.remove('visible'), 6000);
    }

    function programar(funcion, ms) {
      mosaico.temporizadores.push(setTimeout(funcion, ms));
    }

    function destellar(id) {
      const pieza = mosaico.piezas.find((p) => p.id === id);
      const celda = pieza && celdaDe(pieza);
      if (!celda) return;
      celda.classList.remove('llega');
      void celda.offsetWidth;
      celda.classList.add('llega');
      celda.addEventListener('animationend', () => celda.classList.remove('llega'), { once: true });
    }

    function aterrizar(id) {
      mosaico.porAterrizar.delete(id);
      asignar();
      destellar(id);
    }

    // La pieza nueva sale en grande con su autor y luego vuela a su hueco
    function siguienteFoco() {
      if (mosaico.enFoco || modo !== 'mosaico') return;
      if (Date.now() < mosaico.pausaHasta) {
        mosaico.enFoco = true;
        programar(() => { mosaico.enFoco = false; siguienteFoco(); }, mosaico.pausaHasta - Date.now());
        return;
      }
      const pieza = mosaico.colaFoco.shift();
      if (!pieza) return;
      if (!mosaico.conocidas.has(pieza.id)) {  // la han retirado mientras esperaba
        mosaico.porAterrizar.delete(pieza.id);
        return siguienteFoco();
      }
      mosaico.enFoco = true;
      const precarga = new Image();
      precarga.onload = () => enseñarFoco(pieza, precarga.src);
      precarga.onerror = () => { mosaico.enFoco = false; aterrizar(pieza.id); siguienteFoco(); };
      precarga.src = pieza.imagen;
    }

    function enseñarFoco(pieza, src) {
      if (modo !== 'mosaico') return;
      const lienzo = $('lienzo').getBoundingClientRect();
      const lado = Math.min(lienzo.width * 0.8, lienzo.height * 0.6);
      const izquierda = lienzo.left + (lienzo.width - lado) / 2;
      const arriba = lienzo.top + lienzo.height * 0.07;
      const marco = el('div', { class: 'foco-marco', style: { left: `${izquierda}px`, top: `${arriba}px`, width: `${lado}px`, height: `${lado}px` } },
        el('img', { src, alt: pieza.prompt }));
      const pie = el('div', { class: 'foco-pie', style: { left: `${lienzo.left + lienzo.width * 0.05}px`, width: `${lienzo.width * 0.9}px`, top: `${arriba + lado + lienzo.height * 0.03}px` } },
        el('span', { class: 'nueva' }, '✨ ¡Nueva pieza del mosaico!'),
        el('b', {}, `🎨 ${pieza.alias}`),
        el('span', {}, pieza.prompt));
      const foco = el('div', { class: 'foco' }, marco, pie);
      document.body.append(foco);
      $('lienzo').classList.remove('cartel');
      $('lienzo').classList.add('con-foco');
      confeti(50);
      const espera = mosaico.colaFoco.length ? 3000 : 5500;
      programar(() => volar(pieza, foco, marco), espera);
    }

    function volar(pieza, foco, marco) {
      const actual = mosaico.piezas.find((p) => p.id === pieza.id);  // con su número de orden al día
      const celda = actual && celdaDe(actual);
      $('lienzo').classList.remove('con-foco');
      const terminar = () => {
        foco.remove();
        mosaico.enFoco = false;
        aterrizar(pieza.id);
        programar(siguienteFoco, 500);
      };
      if (!celda) return terminar();
      foco.classList.add('vuela');
      const a = marco.getBoundingClientRect();
      const b = celda.getBoundingClientRect();
      const dx = b.left + b.width / 2 - (a.left + a.width / 2);
      const dy = b.top + b.height / 2 - (a.top + a.height / 2);
      const escala = Math.max(b.width, b.height) / a.width;
      const vuelo = marco.animate(
        [{ transform: 'none', borderRadius: '22px' },
          { transform: `translate(${dx}px, ${dy}px) scale(${escala})`, borderRadius: `${2 / escala}px`, boxShadow: 'none' }],
        { duration: 1100, easing: 'cubic-bezier(.55, 0, .25, 1)', fill: 'forwards' });
      vuelo.onfinish = terminar;
    }

    function cancelarFocos() {
      mosaico.temporizadores.forEach(clearTimeout);
      mosaico.temporizadores = [];
      document.querySelectorAll('.foco').forEach((f) => f.remove());
      $('lienzo').classList.remove('con-foco', 'cartel');
      mosaico.colaFoco = [];
      mosaico.porAterrizar.clear();
      mosaico.enFoco = false;
      if (mosaico.columnas) asignar();
    }

    function fasesCartel() {
      const lienzo = $('lienzo');
      if (modo !== 'mosaico' || !mosaico.proporcion || !mosaico.piezas.length || mosaico.enFoco) return;
      lienzo.classList.add('cartel');
      programar(() => lienzo.classList.remove('cartel'), CARTEL_DURA);
    }

    // --- Modo normal ---

    function pase() {
      if (modo !== 'normal' || Date.now() - ultimaNueva < NUEVA_DURANTE || imagenes.length < 2) return;
      indicePase = (indicePase + 1) % Math.min(imagenes.length, 12);
      destacar(imagenes[indicePase], false);
    }

    function destacar(img, esNueva) {
      destacadaId = img.id;
      const caja = $('destacada');
      const precarga = new Image();
      precarga.onload = () => {
        if (destacadaId !== img.id) return;
        const autor = `🎨 ${img.alias}${img.votos ? ` · ❤️ ${img.votos}` : ''}`;
        caja.replaceChildren(...[
          el('img', { class: 'difuso', src: img.mini, alt: '' }),
          el('img', { class: 'nitida', src: img.vista || img.imagen, alt: img.prompt }),
          esNueva ? el('div', { class: 'nueva' }, '✨ ¡Recién salida!') : null,
          el('div', { class: 'pie' }, el('div', { class: 'autor' }, autor), el('div', { class: 'texto' }, img.prompt)),
        ].filter(Boolean));
        caja.classList.remove('entra');
        void caja.offsetWidth;
        caja.classList.add('entra');
        if (esNueva) confeti(70);
        pintarTira();
      };
      precarga.src = img.vista || img.imagen;
    }

    function vaciar() {
      destacadaId = null;
      $('destacada').replaceChildren(nodoVacio);
    }

    function pintarTira() {
      const otras = imagenes.filter((i) => i.id !== destacadaId).slice(0, 8);
      $('tira').replaceChildren(...otras.map((i) =>
        el('figure', {}, el('img', { src: i.mini, alt: i.prompt, loading: 'lazy' }),
          el('figcaption', {}, i.votos ? `${i.alias} · ❤️ ${i.votos}` : i.alias))));
    }

    iniciar();
  </script>
</body>
</html>
